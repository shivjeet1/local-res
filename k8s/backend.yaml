apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: local-res-backend:latest
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args: ["npx prisma migrate deploy && node dist/app.js"]
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:password123@postgres:5432/local_res_db?schema=public"
            - name: PORT
              value: "4000"
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 4000
