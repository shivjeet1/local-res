# docker-compose.yml
# Runs: PostgreSQL + POS API backend
# Desktop Tauri app runs natively — NOT in docker

services:

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       pos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:      postgresql://postgres:password@postgres:5432/pos_db
      JWT_SECRET:        ${JWT_SECRET:-change-me-for-production}
      PORT:              4000
      NODE_ENV:          development
      ALLOWED_ORIGINS:   tauri://localhost
    ports:
      - "4000:4000"
    volumes:
      - ../backend/src:/app/backend/src
      - ../backend/prisma:/app/backend/prisma
      - ../packages/shared/src:/app/packages/shared/src
    command: >
      sh -c "cd backend && npx prisma migrate deploy && npx tsx src/prisma/seed.ts || true && npm run dev"

volumes:
  pgdata:
